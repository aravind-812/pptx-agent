<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPT Agent — Codemap Playground</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b0b10;
    --panel: #13131d;
    --card: #1a1a28;
    --border: #2a2a40;
    --text: #e2e2f0;
    --muted: #666688;
    --purple: #8b5cf6;
    --blue: #3b82f6;
    --green: #10b981;
    --amber: #f59e0b;
    --pink: #ec4899;
    --gray: #6b7280;
    --red: #ef4444;
    --teal: #14b8a6;
    --indigo: #6366f1;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
    z-index: 10;
  }
  .logo { font-size: 18px; font-weight: 700; color: var(--purple); letter-spacing: -0.5px; }
  .logo span { color: var(--text); }
  .tagline { color: var(--muted); font-size: 12px; }
  .legend {
    margin-left: auto;
    display: flex;
    gap: 12px;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
  }
  .legend-item { display: flex; align-items: center; gap: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .hint {
    font-size: 11px;
    color: var(--muted);
    background: #ffffff0a;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* ── Main Layout ── */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Left Sidebar ── */
  .sidebar {
    width: 200px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .sidebar-section { padding: 0 12px; margin-bottom: 16px; }
  .sidebar-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
    padding: 0 4px;
  }
  .sidebar-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 11.5px;
    color: #aaa;
    transition: all 0.15s;
    border: 1px solid transparent;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sidebar-item:hover { background: #ffffff08; color: var(--text); }
  .sidebar-item.active {
    background: #8b5cf620;
    color: var(--purple);
    border-color: #8b5cf630;
  }
  .sidebar-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

  /* ── Graph Panel ── */
  .graph-panel {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: var(--bg);
  }
  #graph-svg {
    width: 100%;
    height: 100%;
    cursor: grab;
  }
  #graph-svg:active { cursor: grabbing; }
  .zoom-controls {
    position: absolute;
    bottom: 12px;
    left: 12px;
    display: flex;
    gap: 4px;
  }
  .zoom-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .zoom-btn:hover { background: var(--border); }
  .graph-hint {
    position: absolute;
    bottom: 12px;
    right: 12px;
    font-size: 10px;
    color: var(--muted);
    background: var(--card);
    padding: 4px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
  }

  /* ── Code Panel ── */
  .code-panel {
    width: 440px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .code-panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }
  .file-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    border: 1px solid transparent;
  }
  .file-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .file-desc { font-size: 11px; color: var(--muted); line-height: 1.4; margin-top: 2px; }
  .meta-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .meta-chip {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid var(--border);
    color: var(--muted);
    background: #ffffff05;
  }
  .meta-chip b { color: var(--text); }
  .code-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: auto;
  }
  .code-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
  .code-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  pre {
    font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
    font-size: 11px;
    line-height: 1.6;
    padding: 14px;
    white-space: pre;
    color: #c9d1d9;
  }
  /* Syntax highlight colors */
  .kw { color: #ff79c6; }
  .str { color: #f1fa8c; }
  .com { color: #6272a4; font-style: italic; }
  .fn { color: #50fa7b; }
  .cls { color: #8be9fd; }
  .num { color: #bd93f9; }
  .deco { color: #ffb86c; }
  .punct { color: #aaa; }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    gap: 8px;
    padding: 20px;
    text-align: center;
  }
  .empty-icon { font-size: 36px; }
  .empty-title { font-size: 14px; color: var(--text); }
  .empty-sub { font-size: 12px; line-height: 1.5; }

  .deps-section {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .deps-title { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .deps-row { display: flex; flex-wrap: wrap; gap: 4px; }
  .dep-chip {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    cursor: pointer;
    border: 1px solid var(--border);
    color: #aaa;
    background: #ffffff05;
    transition: all 0.12s;
  }
  .dep-chip:hover { background: #ffffff12; color: var(--text); }

  /* SVG styles */
  .node-group { cursor: pointer; }
  .node-group:hover .node-rect { filter: brightness(1.2); }
  .node-rect { rx: 8; ry: 8; }
  .node-label { font-family: -apple-system, sans-serif; font-size: 11px; fill: #fff; font-weight: 500; pointer-events: none; }
  .node-sub { font-family: -apple-system, sans-serif; font-size: 9px; fill: rgba(255,255,255,0.55); pointer-events: none; }
  .layer-label { font-family: -apple-system, sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; fill: rgba(255,255,255,0.2); }
  .edge { fill: none; stroke-width: 1.5; opacity: 0.5; }
  .edge-dashed { stroke-dasharray: 4 3; }

  .node-rect.selected { stroke-width: 2; stroke: #fff; filter: brightness(1.3) drop-shadow(0 0 6px rgba(255,255,255,0.3)); }
</style>
</head>

<script>
// ─── Module Data ─────────────────────────────────────────────────────────────
const MODULES = {
  'run.py': {
    label: 'run.py', sub: 'CLI entry', category: 'entry', color: '#6b7280',
    desc: 'Command-line entry point. Accepts transcript + template paths, invokes the full pipeline via graph.invoke(), saves output PPTX.',
    role: 'Entry Point', model: '—', cost: '0',
    deps: ['graph.py', 'llm_factory.py'],
    code: `#!/usr/bin/env python3
"""CLI entry point — run the full pipeline on one transcript."""
import argparse, sys
from pathlib import Path
from graph import graph
from llm_factory import default_provider, planner_model, executor_model

def main():
    parser = argparse.ArgumentParser(description="PPT Agent: fill a PPTX from a transcript")
    parser.add_argument("transcript", help="Path to transcript .txt file")
    parser.add_argument("template",   help="Path to .pptx template")
    parser.add_argument("--output",   default="output.pptx")
    parser.add_argument("--provider", default="")
    args = parser.parse_args()

    provider = args.provider.strip() or default_provider()
    state = {
        "transcript_path": args.transcript,
        "template_path":   args.template,
        "output_path":     args.output,
        "work_dir":        str(Path(args.output).parent),
        "provider":        provider,
        "planner_model":   planner_model(provider),
        "executor_model":  executor_model(provider),
        "edit_plan": {}, "review_verdict": "",
        "review_issues": [], "fix_attempts": 0,
    }
    print(f"Running pipeline — provider={provider}")
    result = graph.invoke(state)
    verdict = result.get("review_verdict", "?")
    print(f"Done. Verdict: {verdict}  →  {args.output}")

if __name__ == "__main__":
    main()`
  },

  'backend.py': {
    label: 'backend.py', sub: 'FastAPI server', category: 'core', color: '#3b82f6',
    desc: 'FastAPI server with SSE streaming. Exposes /api/generate (pipeline), /api/eval/* (eval flywheel). Bridges browser UI to Python pipeline.',
    role: 'API Server', model: '—', cost: '0',
    deps: ['graph.py', 'llm_factory.py', 'eval_agent/benchmark.py', 'eval_agent/auto_improve.py'],
    code: `# FastAPI backend — Server-Sent Events streaming for LangGraph pipeline
# Key endpoints:
#   POST /api/generate       → SSE stream of pipeline run
#   GET  /api/providers      → available LLM providers
#   GET  /api/slides/{id}    → rendered PNG slides
#   GET  /api/download/{id}  → download output PPTX
#   GET  /api/eval/transcripts → list eval corpus
#   POST /api/eval/run       → SSE stream of batch eval run
#   GET  /api/eval/results   → benchmark history
#   POST /api/eval/improve   → auto-improve: cluster failures → prompt patch
#   POST /api/eval/apply-patch → human-triggered patch apply
#   POST /api/eval/calibrate → F1 score vs human labels

@app.post("/api/generate")
async def generate(template: UploadFile, transcript: str = Form(""), ...):
    """
    SSE stream. Events:
      {"type": "model_info",     "provider": ..., "planner_model": ..., "executor_model": ...}
      {"type": "node_start",     "node": "extractor"|"planner"|"executor"|"reviewer"}
      {"type": "thinking"}       # LLM started
      {"type": "tool_call",      "tool": "...", "args": {...}}
      {"type": "tool_result",    "output": "..."}
      {"type": "plan_summary",   "edits": N, "removes": M, "summary": "..."}
      {"type": "executor_done",  "attempt": N}
      {"type": "reviewer_done",  "verdict": "PASS"|"FIX NEEDED", "issues": [...]}
      {"type": "done",           "file_id": "uuid"}
      {"type": "slides_ready",   "file_id": "...", "count": N}
      {"type": "error",          "msg": "..."}
    """
    # 1. Save template to tmpdir
    # 2. Parse transcript (text or PDF via tools/pdf_parser.py)
    # 3. Push events to asyncio.Queue via callback
    # 4. Run graph in thread pool (run_in_executor)
    # 5. Render PNG slides via op_render_png (optional preview)
    # 6. Stream SSE until "done" or "error"

@app.post("/api/eval/run")
async def eval_run(template: UploadFile, provider: str, transcript_ids: str):
    """SSE stream of batch eval. Events from eval_agent.benchmark.run_benchmark()."""
    # Calls run_benchmark(template_path, tx_paths, provider, on_progress=put)
    # SSE ends on {"type": "eval_done"} or {"type": "error"}

_EVAL_TRANSCRIPTS_DIR = Path(__file__).parent / "eval_transcripts"`
  },

  'graph.py': {
    label: 'graph.py', sub: 'LangGraph pipeline', category: 'core', color: '#3b82f6',
    desc: 'Defines the LangGraph state machine: Extractor→Planner→Executor→Reviewer with conditional fix loop (max 2 attempts). PipelineState TypedDict defines shared state.',
    role: 'Pipeline Orchestrator', model: '—', cost: '0',
    deps: ['agents/extractor.py', 'agents/planner.py', 'agents/executor.py', 'agents/reviewer.py'],
    code: `"""LangGraph pipeline: extractor → planner → executor → reviewer (with fix loop)."""
from typing import List, Optional, TypedDict
from langgraph.graph import END, StateGraph
from agents.executor import executor_node
from agents.extractor import extractor_node
from agents.planner import planner_node
from agents.reviewer import reviewer_node

MAX_FIX_ATTEMPTS = 2

class PipelineState(TypedDict):
    transcript_path: str       # path to source transcript
    template_path:   str       # path to PPTX template
    output_path:     str       # path for output PPTX
    work_dir:        str       # temp directory
    provider:        str       # "anthropic" | "openai"
    planner_model:   str       # e.g. "claude-sonnet-4-6"
    executor_model:  str       # e.g. "claude-haiku-4-5-20251001"
    extracted_facts: Optional[dict]  # extractor output (None if short transcript)
    edit_plan:       dict      # planner JSON output
    review_verdict:  str       # "PASS" | "FIX NEEDED"
    review_issues:   List[str] # list of issues from reviewer
    fix_attempts:    int       # number of fix attempts so far

def _route(state: PipelineState) -> str:
    if state.get("review_verdict") == "PASS":
        return "end"
    if state.get("fix_attempts", 0) >= MAX_FIX_ATTEMPTS:
        return "end"  # give up gracefully
    return "fix"

builder = StateGraph(PipelineState)
builder.add_node("extractor", extractor_node)
builder.add_node("planner",   planner_node)
builder.add_node("executor",  executor_node)
builder.add_node("reviewer",  reviewer_node)

builder.set_entry_point("extractor")
builder.add_edge("extractor", "planner")
builder.add_edge("planner",   "executor")
builder.add_edge("executor",  "reviewer")
builder.add_conditional_edges("reviewer", _route, {"fix": "executor", "end": END})

graph = builder.compile()
# Data flow: PipelineState dict passed through all nodes, each returns merged updates`
  },

  'llm_factory.py': {
    label: 'llm_factory.py', sub: 'LLM factory', category: 'core', color: '#3b82f6',
    desc: 'Centralized LLM provider factory. Picks models by role (planner=Sonnet, executor/reviewer=Haiku). Cached get_llm() avoids repeated instantiation.',
    role: 'LLM Provider', model: '—', cost: '0',
    deps: [],
    code: `"""LLM factory — picks provider based on available API keys."""
# Priority: Anthropic first (higher quality), then OpenAI

ANTHROPIC_MODELS = [
    {"id": "claude-sonnet-4-6",         "label": "Sonnet 4.6"},  # planner
    {"id": "claude-opus-4-7",           "label": "Opus 4.7"},
    {"id": "claude-haiku-4-5-20251001", "label": "Haiku 4.5"},   # executor + reviewer
]
OPENAI_MODELS = [
    {"id": "gpt-4o",      "label": "GPT-4o"},       # planner
    {"id": "gpt-4o-mini", "label": "GPT-4o mini"},  # executor + reviewer
]

def default_provider() -> str:
    """Anthropic first if ANTHROPIC_API_KEY set, else OpenAI."""
    if ANTHROPIC_KEY: return "anthropic"
    if OPENAI_KEY:    return "openai"
    raise RuntimeError("No API key found. Set ANTHROPIC_API_KEY or OPENAI_API_KEY")

def planner_model(provider: str) -> str:
    """Best reasoning model — used for planning (1 call per run)."""
    return "claude-sonnet-4-6" if provider == "anthropic" else "gpt-4o"

def executor_model(provider: str) -> str:
    """Fast cheap model — executor + reviewer + eval judges (many calls)."""
    return "claude-haiku-4-5-20251001" if provider == "anthropic" else "gpt-4o-mini"

@lru_cache(maxsize=16)
def get_llm(provider: str, model: str, max_tokens: int = 4096):
    """Return a cached LangChain chat model."""
    if provider == "openai":
        from langchain_openai import ChatOpenAI
        return ChatOpenAI(model=model, max_tokens=max_tokens)
    else:
        from langchain_anthropic import ChatAnthropic
        return ChatAnthropic(model=model, max_tokens=max_tokens)`
  },

  'agents/extractor.py': {
    label: 'extractor.py', sub: 'Haiku · chunk + extract', category: 'agent', color: '#8b5cf6',
    desc: 'Pre-processes large transcripts (>30K chars) into structured JSON facts. Splits on call boundaries, extracts facts per chunk, merges. Short transcripts skip LLM entirely.',
    role: 'Pre-processor', model: 'Haiku 4.5', cost: '~$0.001',
    deps: ['llm_factory.py'],
    code: `"""Transcript extractor: distils raw sales-call transcripts into structured facts."""
_SHORT_TRANSCRIPT_CHARS = 30_000  # skip LLM below this — planner handles raw
_CHUNK_SIZE = 60_000              # chars per chunk for very long transcripts

# Output schema (JSON):
# {
#   customer_profile: {industry, size, current_state}
#   project: {name, scope, phases, out_of_scope}
#   timeline: [{milestone, date}]
#   budget: {total, remaining, notes}
#   stakeholders: [{role, responsibility}]
#   key_decisions: [str]
#   modules_features: [str]
#   pain_points: [str]
#   success_criteria: [str]
#   verbatim_highlights: [str]
#   all_facts: [str]   ← exhaustive: every number, date, name, %
# }

def extractor_node(state: dict) -> dict:
    raw = Path(state["transcript_path"]).read_text(encoding="utf-8")

    # Short transcripts: skip extraction — planner handles raw directly
    if len(raw) <= _SHORT_TRANSCRIPT_CHARS:
        return {**state, "extracted_facts": {}}

    llm = get_llm(provider, model, max_tokens=4096)
    chunks = _split_transcript(raw)  # split on ====...==== call boundaries

    extractions = []
    for chunk in chunks:
        resp = llm.invoke([sys_msg, HumanMessage(content=chunk)])
        parsed = _parse_json(resp.content)
        if parsed:
            extractions.append(parsed)

    merged = _merge(extractions)  # dedup list keys, merge dict keys
    return {**state, "extracted_facts": merged}

# Prompt rules:
# - Extract ONLY what appears in transcript (no inference)
# - Preserve exact numbers, dates, percentages, proper nouns verbatim
# - all_facts must be exhaustive
# - Omit scheduling logistics, smalltalk, hold music`
  },

  'agents/planner.py': {
    label: 'planner.py', sub: 'Sonnet · vision + JSON plan', category: 'agent', color: '#8b5cf6',
    desc: 'Reads transcript/extracted facts + template shape inventory (+ rendered slide thumbnails). Outputs a JSON edit plan with slide-level edits, shape targets, and new text. Uses Sonnet for complex reasoning.',
    role: 'Planner', model: 'Sonnet 4.6', cost: '~$0.02–0.08',
    deps: ['llm_factory.py', 'tools/pptx_editor.py'],
    code: `"""pptx-planner: reads content document + shape inventory, outputs JSON edit plan."""
# Key principle: EDIT existing template — NOT generating new slides
# Two failure modes to avoid:
#   1. Fabrication  — inventing facts not in source → OFF LIMITS
#   2. Sanitization — paraphrasing specifics into generic safe text → EQUALLY OFF LIMITS

# Edit plan JSON structure:
# {
#   "document_summary": "...",
#   "slides_to_remove": [3, 7],      # slide numbers (1-based) to delete
#   "delete_shapes": [               # shapes to remove
#     {"slide": 2, "shape": "Subtitle"}
#   ],
#   "edits": [                       # text edits (main payload)
#     {
#       "slide": 1,
#       "shape": "Title 1",
#       "text": "Q3 Roadmap — Exact verbatim content from source",
#       "bullets": ["Line 1", "Line 2"]   # optional, for bullet shapes
#     }
#   ],

# Checks edit_plan.strategic_context.all_key_facts (planner's identified facts)

def evaluate_completeness(
    state:         dict,     # PipelineState — has edit_plan
    pptx_all_text: str,
    provider:      str = None,
) -> EvalResult:
    facts = (state.get("edit_plan", {})
             .get("strategic_context", {})
             .get("all_key_facts", []))

    if not facts:  # planner didn't extract facts → can't evaluate
        return EvalResult("completeness", passed=True, reasoning="No key facts in plan", confidence=0.5)

    if ratio < 0.50:   # clearly failing
        return EvalResult("completeness", passed=False, reasoning=f"Only {ratio:.0%} of facts present", confidence=0.85)

    """
    PASS if: batch_apply phase applied ≥ 90% of planned edits

// ─── Syntax Highlighter ───────────────────────────────────────────────────────
function highlight(code) {
  return code
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Comments
    .replace(/(#[^\n]*)/g, '<span class="com">$1</span>')
    .replace(/("""[\s\S]*?""")/g, (m) => '<span class="com">' + m + '</span>')
    // Decorators
    .replace(/(@\w+)/g, '<span class="deco">$1</span>')
    // Keywords
    .replace(/\b(def|class|import|from|return|if|else|elif|for|in|not|and|or|None|True|False|raise|try|except|with|as|await|async|yield|pass|break|continue|lambda|global|nonlocal)\b/g, '<span class="kw">$1</span>')
    // Class names (capitalized words)
    .replace(/\b([A-Z][a-zA-Z0-9_]+)\b/g, '<span class="cls">$1</span>')
    // Function calls (word followed by ()
    .replace(/\b([a-z_][a-z_0-9]+)(?=\s*\()/g, '<span class="fn">$1</span>')
    // Strings
    .replace(/("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`)/g, '<span class="str">$1</span>')
    // Numbers
    .replace(/\b(\d+\.?\d*)\b/g, '<span class="num">$1</span>');
}

  // Edges
  EDGES.forEach(edge => {
    const fromNode = NODES.find(n => n.id === edge.from);
    const toNode   = NODES.find(n => n.id === edge.to);
    if (!fromNode || !toNode) return;

    const x1 = fromNode.x + fromNode.w / 2;
    const y1 = fromNode.y + fromNode.h;
    const x2 = toNode.x + toNode.w / 2;
    const y2 = toNode.y;

    const strokeColor = edge.color.length > 7 ? edge.color.substring(0, 7) : edge.color;
    const arrowId = 'arrow-' + strokeColor.replace('#','');

    const path = document.createElementNS(svgNS, 'path');
    const midY = (y1 + y2) / 2;
    const d = `M ${x1} ${y1} C ${x1} ${midY} ${x2} ${midY} ${x2} ${y2}`;
    path.setAttribute('d', d);
    path.setAttribute('stroke', edge.color);
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('opacity', '0.6');
    if (edge.dashed) path.setAttribute('stroke-dasharray', '4 3');
    if (document.getElementById(arrowId)) {
      path.setAttribute('marker-end', `url(#${arrowId})`);
    }
    gRoot.appendChild(path);
  });

  // Nodes
  NODES.forEach(node => {
    const mod = MODULES[node.id];
    const color = mod ? mod.color : '#6b7280';
    const label = mod ? mod.label : node.id;
    const sub   = mod ? mod.sub   : '';

    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'node-group');
    g.setAttribute('data-id', node.id);
    g.style.cursor = 'pointer';

    // Background rect
    const rect = document.createElementNS(svgNS, 'rect');
    rect.setAttribute('x', node.x); rect.setAttribute('y', node.y);
    rect.setAttribute('width', node.w); rect.setAttribute('height', node.h);
    rect.setAttribute('rx', '8'); rect.setAttribute('ry', '8');
    rect.setAttribute('fill', color + '25');
    rect.setAttribute('stroke', color);
    rect.setAttribute('stroke-width', '1.2');
    rect.setAttribute('class', 'node-rect');
    rect.setAttribute('data-id', node.id);
    g.appendChild(rect);

    // Label
    const text = document.createElementNS(svgNS, 'text');
    text.setAttribute('x', node.x + node.w / 2);
    text.setAttribute('y', node.y + (sub ? 14 : 20));
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#e2e2f0');
    text.setAttribute('font-size', '11');
    text.setAttribute('font-weight', '600');
    text.setAttribute('font-family', '-apple-system, sans-serif');
    text.textContent = label;
    g.appendChild(text);

    if (sub) {
      const subText = document.createElementNS(svgNS, 'text');
      subText.setAttribute('x', node.x + node.w / 2);
      subText.setAttribute('y', node.y + 26);
      subText.setAttribute('text-anchor', 'middle');
      subText.setAttribute('fill', 'rgba(255,255,255,0.45)');
      subText.setAttribute('font-size', '9');
      subText.setAttribute('font-family', '-apple-system, sans-serif');
      subText.textContent = sub;
      g.appendChild(subText);
    }

    g.addEventListener('click', () => selectNode(node.id));
    gRoot.appendChild(g);
  });

  applyTransform();
}

function applyTransform() {
  if (gRoot) {
    gRoot.setAttribute('transform', `translate(${transform.x}, ${transform.y}) scale(${transform.scale})`);
  }
}

function selectNode(id) {
  selectedNode = id;

  // Update SVG selection
  document.querySelectorAll('.node-rect').forEach(r => r.classList.remove('selected'));
  document.querySelectorAll(`.node-rect[data-id="${id}"]`).forEach(r => r.classList.add('selected'));

  // Update sidebar
  document.querySelectorAll('.sidebar-item').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });

  // Update code panel
  showModule(id);
}

function showModule(id) {
  const mod = MODULES[id];
  const empty = document.getElementById('empty-state');
  const content = document.getElementById('code-content');

  if (!mod) { empty.style.display='flex'; content.style.display='none'; return; }

  empty.style.display = 'none';
  content.style.display = 'flex';

  // Badge
  const badge = document.getElementById('file-badge');
  const catLabels = {agent:'Agent',core:'Core',tool:'Tool',eval:'Eval',frontend:'Frontend',entry:'Entry'};
  badge.textContent = catLabels[mod.category] || mod.category;
  badge.style.background = mod.color + '25';
  badge.style.borderColor = mod.color + '60';
  badge.style.color = mod.color;

  document.getElementById('file-title').textContent = mod.label;
  document.getElementById('file-desc').textContent = mod.desc;

  // Meta
  const metaRow = document.getElementById('meta-row');
  metaRow.innerHTML = [
    mod.role  ? `<div class="meta-chip"><b>Role:</b> ${mod.role}</div>` : '',
    mod.model ? `<div class="meta-chip"><b>Model:</b> ${mod.model}</div>` : '',
    mod.cost  ? `<div class="meta-chip"><b>Cost/run:</b> ${mod.cost}</div>` : '',
  ].join('');

  // Code
  document.getElementById('code-pre').innerHTML = highlight(mod.code);

  // Deps
  const depsSection = document.getElementById('deps-section');
  if (mod.deps && mod.deps.length > 0) {
    depsSection.innerHTML = `
      <div class="deps-title">Dependencies</div>
      <div class="deps-row">
        ${mod.deps.map(d => `<div class="dep-chip" onclick="selectNode('${d}')">${d}</div>`).join('')}
      </div>`;
    depsSection.style.display = 'block';
  } else {
    depsSection.style.display = 'none';
  }
}

// ─── Sidebar ─────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sidebar = document.getElementById('sidebar');
  const categories = [
    { id: 'entry',    label: 'Entry Points', color: '#6b7280' },
    { id: 'core',     label: 'Core',         color: '#3b82f6' },
    { id: 'agent',    label: 'Agents',       color: '#8b5cf6' },
    { id: 'tool',     label: 'Tools',        color: '#10b981' },
    { id: 'eval',     label: 'Eval Flywheel',color: '#f59e0b' },
    { id: 'frontend', label: 'Frontend',     color: '#ec4899' },
  ];

  sidebar.innerHTML = '';
  categories.forEach(cat => {
    const mods = Object.entries(MODULES).filter(([, m]) => m.category === cat.id);
    if (!mods.length) return;

    const section = document.createElement('div');
    section.className = 'sidebar-section';
    section.innerHTML = `<div class="sidebar-label" style="color:${cat.color}88">${cat.label}</div>`;

    mods.forEach(([id, mod]) => {
      const item = document.createElement('div');
      item.className = 'sidebar-item';
      item.dataset.id = id;
      item.innerHTML = `
        <div class="sidebar-dot" style="background:${cat.color}"></div>
        <span>${mod.label}</span>
      `;
      item.addEventListener('click', () => selectNode(id));
      section.appendChild(item);
    });

    sidebar.appendChild(section);
  });
}

// ─── Pan & Zoom ───────────────────────────────────────────────────────────────
function initPanZoom() {
  svg.addEventListener('mousedown', e => {
    if (e.target.closest('.node-group')) return;
    dragging = true;
    dragStart = { x: e.clientX - transform.x, y: e.clientY - transform.y };
    svg.style.cursor = 'grabbing';
  });

  svg.addEventListener('mousemove', e => {
    if (!dragging) return;
    transform.x = e.clientX - dragStart.x;
    transform.y = e.clientY - dragStart.y;
    applyTransform();
  });

  svg.addEventListener('mouseup', () => { dragging = false; svg.style.cursor = 'grab'; });
  svg.addEventListener('mouseleave', () => { dragging = false; svg.style.cursor = 'grab'; });

  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.max(0.3, Math.min(3, transform.scale * delta));
    transform.x = mx - (mx - transform.x) * (newScale / transform.scale);
    transform.y = my - (my - transform.y) * (newScale / transform.scale);
    transform.scale = newScale;
    applyTransform();
  }, { passive: false });

  document.getElementById('zoom-in').addEventListener('click', () => {
    transform.scale = Math.min(3, transform.scale * 1.2);
    applyTransform();
  });
  document.getElementById('zoom-out').addEventListener('click', () => {
    transform.scale = Math.max(0.3, transform.scale / 1.2);
    applyTransform();
  });
  document.getElementById('zoom-reset').addEventListener('click', () => {
    transform = { x: 20, y: 30, scale: 1 };
    applyTransform();
  });
}

// ─── Init ─────────────────────────────────────────────────────────────────────
buildSidebar();
buildGraph();
initPanZoom();

// Initial transform — center the graph with some padding
transform = { x: 20, y: 30, scale: 1 };
applyTransform();
</script>
